# Körs vid push till main och vid pull requests. Grön CI krävs före merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruff och pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Installera uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Installera Python och beroenden (enligt uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
