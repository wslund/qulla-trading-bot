[project]
name = "qulla-trading-bot"
dynamic = ["version"]
description = "Automatiserad tradingbot baserad på Qullamaggies breakout-strategi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
# Nätverksadaptrar; krävs inte för tester.
yahoo = ["yfinance>=0.2.50"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tradingbot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Bara toppnivåkatalogen research/ undantas från lint (ett bart "research" träffar alla mappar med det namnet).
extend-exclude = ["./research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
